<script>
'use strict';
/**
 * scripts/cutplan-editor/cutplan-core.js — cutplan.md 的最小可編輯核心(純函式、零依賴)。
 *
 * 語意對齊 scripts/audio/cutplan.py(write_cutplan_md)與 scripts/audio/render_cut.py
 * (LINE_RE / parse_program / parse_strikes)——block 行格式、speaker 前綴、行尾
 * ` ← 理由` 後綴、`~~刪除線~~` 語法皆照抄。**只開放兩個編輯動作**:
 *   1. toggleCheckbox — 切換 `- [x]` / `- [ ]`
 *   2. applyStrike    — 對 block 內文反白範圍加/去 `~~刪除線~~`
 * 其餘一切(id、時間碼、非 block 行)一律唯讀,本檔不提供任何改動它們的 API。
 *
 * 這支檔案同時給 Node(`node --test`)與瀏覽器(`<script>` 內嵌)使用,
 * 檔尾用 module.exports guard,不用任何 import/export 語法。
 *
 * ## 內部資料結構
 *
 * Doc = { lines: Line[] }
 * Line(唯讀行)  = { editable:false, raw, term }
 * Line(block 行) = { editable:true, term, mark, id, timecode, prefix, bodyRaw, reason }
 *   - raw/bodyRaw 等欄位重組回去('- [' + mark + '] ' + id + ' [' + timecode + '] '
 *     + prefix + bodyRaw + reason)必須逐 byte 等於原始行內容 —— parseLine 只是
 *     單純把同一個字串切成幾段,天生可逆,不需要額外驗證。
 *   - term = 該行的行尾符號('\n' / '\r\n' / '\r' / '')。檔案最後一行沒有結尾
 *     換行時 term = ''。
 *
 * ## 刪除線(strike)座標系統
 *
 * splitStrikes(bodyRaw) 把 `~~...~~` 標記拆掉,回傳:
 *   - clean:  拿掉所有 `~~` 標記後「看得到」的文字(空白照留,方便 UI 直接
 *     用一般 JS 字串索引對應反白範圍,不像 Python parse_strikes 用去空白座標)
 *   - pieces: 依序排列的 {kind:'plain'|'struck', raw, cleanStart, cleanEnd}
 *     連續片段,raw 部分 plain 片段 raw === clean.slice(cleanStart,cleanEnd)
 *     (identity),struck 片段的 raw = 內文(不含 `~~`),clean 對應同一段內文。
 *     pieces 串接 raw(struck 片段外加 `~~...~~`)可以精確還原 bodyRaw。
 *
 * `~~` 配對規則抄 Python parse_strikes:由左到右找 `~~`,配下一個 `~~` 當
 * 收尾;找不到收尾就當字面文字。這個算法天生不會有「巢狀」——第一個 `~~`
 * 一定跟「下一個」`~~` 配對,配對區間內部不可能再出現 `~~`(出現了就會被
 * 當成收尾提早結束)。因此 pieces 永遠是扁平的一維序列,沒有巢狀樹狀結構
 * 要處理。
 *
 * ## 反白範圍的合法性(邊界 f)
 *
 * classifySelection(bodyRaw, start, end) 回四種結果,不留未定義行為:
 *   - 'add'    — [start,end) 是非空範圍,且不與任何既有 struck 片段相交 →
 *                整段包 `~~`。
 *   - 'remove' — [start,end) 是非空範圍,且跟至少一個既有 struck 片段有交集
 *                (完全包含它、被它完全包含、部分重疊、或橫跨多個 struck
 *                片段皆算)→ **每一個有交集的 struck 片段整段拆掉 `~~`**,
 *                即使選取只蓋到該片段的一部分;選取範圍內原本就是 plain
 *                的文字不受影響。這是 2026-08-11 MM 實測回報的兩個 bug
 *                (「`~~1~~ 23 ~~4~~` 沒辦法批次取消」「現在也沒辦法取消」)
 *                的修正——舊版只有「選取恰好等於單一 struck 片段邊界」才
 *                判定可取消,手機長按拖曳選取幾乎不可能精準對齊那個邊界,
 *                於是幾乎所有真實的「取消刪除線」操作都落回 'invalid'。
 *   - 'empty'  — start === end(合法索引但沒有反白任何文字)。跟 'invalid'
 *                分開列一種狀態,是因為呼叫端(UI)要用它來顯示「請先反白
 *                文字」這種可見提示,而不是跟「索引根本不合法」用同一種
 *                靜默失敗處理。
 *   - 'invalid'— 索引不合法(非整數、負數、end < start、超出 clean 文字
 *                長度)。toggleStrike/applyStrike 對 'empty' 與 'invalid'
 *                都會丟錯(訊息不同),不會靜默猜測使用者想做什麼、也不會
 *                產生巢狀 `~~~~` 這種無法回頭解析的輸出。
 */

// `- [x] B0018 [1:59–2:10] 其餘內容...` — 對齊 scripts/audio/render_cut.py 的 LINE_RE。
// 注意:不 trim 就直接從行首匹配 —— 沒有前導空白的行才視為可編輯 block 行,
// 任何非標準排版(縮排、額外空白)一律落回唯讀,寧可少開放也不誤判可編輯。
const BLOCK_LINE_RE = /^- \[( |x|X)\] ([A-Z]{1,2}\d{3,5}) \[([^\]]+)\] (.*)$/;

// `## <emoji>` 結構行的標記清單 —— 對齊 scripts/audio/render_cut.py 的
// CONFIG_RE/CUT_RE/MUSIC_RE/INSERT_RE/TEASER_RE/ROOMTONE_RE。這些行是 render
// 的參數,對人審沒有意義,不當章節分隔線顯示(仍原封不動保留在 doc 裡)。
// **新增 render 端結構行時一定要同步加進來**,否則編輯器會把它畫成章節標題
// —— 清單放這裡而不是 Index.html,是因為只有這裡有測試守著。
const STRUCTURE_MARKERS = ['⚙', '✂', '✚', '🎵', '➕', '🎬', '🔇'];

// 只有這種 `## 標題` 才算章節分隔線;結構行一律不是。
function isChapterDivider(raw) {
  const m = /^## (.+)$/.exec(raw || '');
  if (!m) return null;
  for (const marker of STRUCTURE_MARKERS) {
    if (m[1].startsWith(marker)) return null;
  }
  return m[1];
}

// speaker 前綴,如 `[KIN] `——對齊 render_cut.py `re.sub(r"^\[[^\]]{1,20}\]\s*", "", body)`
const SPEAKER_PREFIX_RE = /^\[[^\]]{1,20}\]\s*/;

// 行尾人工註記,如 ` ← 二剪:...`——對齊 render_cut.py `body.rsplit(" ← ", 1)`
// (取「最後一個」` ← ` 當分界,跟 Python rsplit 語意一致)。
const REASON_SEP = ' ← ';

// 行尾符號(保留 CRLF/LF/CR 與「無結尾換行」四種狀態)。
const EOL_RE = /(\r\n|\r|\n)/;

// `## ⚙ line=mixdown audio=tracks` 的行尾軌欄 ` ⟦Mars● Sarah○ Kin○⟧`
// (ADR-2026-10-03-audio-tracks-line)——對齊 scripts/audio/tracks_columns.py 的
// COL_RE / CELL_RE。先於 ` ← 理由` 切掉,所以理由與逐字稿都看不到它。
const TRACKS_COL_RE = /\s*⟦([^⟦⟧]*)⟧\s*$/;
const TRACK_ON = '●';
const TRACK_OFF = '○';
const TRACK_CELL_RE = /^(\S+?)([●○])$/;

// ── 行層級解析 ──────────────────────────────────────────────────────────

function parseLine(content, term) {
  const m = BLOCK_LINE_RE.exec(content);
  if (!m) {
    return { editable: false, raw: content, term };
  }
  const [, mark, id, timecode, restAll] = m;
  const cm = TRACKS_COL_RE.exec(restAll);
  const tracksRaw = cm ? restAll.slice(cm.index) : '';
  const restFull = cm ? restAll.slice(0, cm.index) : restAll;
  const sepIdx = restFull.lastIndexOf(REASON_SEP);
  let rest = restFull;
  let reason = '';
  if (sepIdx >= 0) {
    rest = restFull.slice(0, sepIdx);
    reason = restFull.slice(sepIdx);
  }
  const sm = SPEAKER_PREFIX_RE.exec(rest);
  let prefix = '';
  let bodyRaw = rest;
  if (sm) {
    prefix = sm[0];
    bodyRaw = rest.slice(sm[0].length);
  }
  return { editable: true, term, mark, id, timecode, prefix, bodyRaw, reason, tracksRaw };
}

function serializeLine(line) {
  if (!line.editable) return line.raw;
  return `- [${line.mark}] ${line.id} [${line.timecode}] ${line.prefix}${line.bodyRaw}${line.reason}`
    + (line.tracksRaw || '');
}

// ── 文件層級 parse / serialize ────────────────────────────────────────────

function parseCutplan(text) {
  const parts = text.split(EOL_RE);
  const lines = [];
  for (let i = 0; i < parts.length; i += 2) {
    const content = parts[i];
    const term = parts[i + 1] !== undefined ? parts[i + 1] : '';
    lines.push(parseLine(content, term));
  }
  return { lines };
}

function serializeCutplan(doc) {
  return doc.lines.map((l) => serializeLine(l) + l.term).join('');
}

function isEditableLine(doc, lineIndex) {
  const line = doc.lines[lineIndex];
  return !!(line && line.editable);
}

function requireEditableLine(doc, lineIndex, fnName) {
  const line = doc.lines[lineIndex];
  if (!line || !line.editable) {
    throw new Error(
      `cutplan-core: ${fnName} — 第 ${lineIndex} 行不是可編輯的 block 行(唯讀)`,
    );
  }
  return line;
}

// ── 勾選切換 ────────────────────────────────────────────────────────────

function toggleCheckbox(doc, lineIndex) {
  const line = requireEditableLine(doc, lineIndex, 'toggleCheckbox');
  const newMark = line.mark === ' ' ? 'x' : ' ';
  const lines = doc.lines.slice();
  lines[lineIndex] = { ...line, mark: newMark };
  return { lines };
}

// ── 刪除線:解析 ────────────────────────────────────────────────────────

function splitStrikes(bodyRaw) {
  const pieces = [];
  let cleanPos = 0;
  let curPlain = '';
  let curPlainStart = 0;

  function flushPlain() {
    if (curPlain.length) {
      pieces.push({
        kind: 'plain',
        raw: curPlain,
        cleanStart: curPlainStart,
        cleanEnd: curPlainStart + curPlain.length,
      });
      cleanPos += curPlain.length;
    }
    curPlain = '';
    curPlainStart = cleanPos;
  }

  let i = 0;
  while (i < bodyRaw.length) {
    if (bodyRaw.startsWith('~~', i)) {
      const j = bodyRaw.indexOf('~~', i + 2);
      if (j < 0) {
        // 未閉合的 ~~:當字面文字,原樣併入目前的 plain 片段。
        curPlain += '~~';
        i += 2;
        continue;
      }
      const inner = bodyRaw.slice(i + 2, j);
      flushPlain();
      pieces.push({
        kind: 'struck',
        raw: inner,
        cleanStart: cleanPos,
        cleanEnd: cleanPos + inner.length,
      });
      cleanPos += inner.length;
      curPlainStart = cleanPos;
      i = j + 2;
      continue;
    }
    curPlain += bodyRaw[i];
    i += 1;
  }
  flushPlain();

  const clean = pieces.map((p) => p.raw).join('');
  return { clean, pieces };
}

function serializePieces(pieces) {
  return pieces
    .map((p) => (p.kind === 'struck' ? `~~${p.raw}~~` : p.raw))
    .join('');
}

// 重組 pieces 在 clean 座標 [from,to) 範圍內對應的原始 raw 文字(含既有 ~~)。
// 只在呼叫端已保證該範圍內不會「部分切到」某個 struck 片段時使用
// (見 toggleStrike 的 'add' 分支——classifySelection 已擋掉任何與 struck
// 片段部分交疊的選取,所以這裡遇到的 struck 片段一定整段落在範圍內或外)。
function serializePiecesRange(pieces, from, to) {
  let out = '';
  for (const p of pieces) {
    const s = Math.max(p.cleanStart, from);
    const e = Math.min(p.cleanEnd, to);
    if (s >= e) continue;
    const innerStart = s - p.cleanStart;
    const innerEnd = e - p.cleanStart;
    const seg = p.raw.slice(innerStart, innerEnd);
    out += p.kind === 'struck' ? `~~${seg}~~` : seg;
  }
  return out;
}

// ── 刪除線:合法性判斷(邊界 f)──────────────────────────────────────────

function classifySelection(bodyRaw, cleanStart, cleanEnd) {
  if (
    !Number.isInteger(cleanStart) ||
    !Number.isInteger(cleanEnd) ||
    cleanStart < 0 ||
    cleanEnd < cleanStart
  ) {
    return 'invalid';
  }
  const { clean, pieces } = splitStrikes(bodyRaw);
  if (cleanEnd > clean.length) return 'invalid';
  if (cleanEnd === cleanStart) return 'empty';

  const touchesStruck = pieces.some(
    (p) => p.kind === 'struck' && p.cleanStart < cleanEnd && p.cleanEnd > cleanStart,
  );
  return touchesStruck ? 'remove' : 'add';
}

// ── 刪除線:加 / 去(對 bodyRaw 字串直接操作)────────────────────────────

function toggleStrike(bodyRaw, cleanStart, cleanEnd) {
  const mode = classifySelection(bodyRaw, cleanStart, cleanEnd);
  if (mode === 'empty') {
    throw new Error(
      `cutplan-core: toggleStrike — 選取是空的(游標在 ${cleanStart},沒有反白`
      + '任何文字),請先選取要加/去刪除線的範圍',
    );
  }
  if (mode === 'invalid') {
    throw new Error(
      `cutplan-core: toggleStrike — 選取範圍 [${cleanStart},${cleanEnd}) 超出`
      + '內文長度或索引不合法',
    );
  }
  const { clean, pieces } = splitStrikes(bodyRaw);
  if (mode === 'remove') {
    // 選取範圍內「有交集」的既有刪除線片段,整段拆掉 ~~ —— 即使選取只蓋到
    // 該片段的一部分,也整段一起取消(MM 要的「批次取消」語意:
    // `~~1~~ 23 ~~4~~` 全選 → `1 23 4`)。選取範圍內原本就是 plain 的文字
    // 原樣通過,不會被新增標記——這個操作只拆既有的 ~~,不會新增。
    return pieces
      .map((p) => {
        const touched = p.kind === 'struck'
          && p.cleanStart < cleanEnd && p.cleanEnd > cleanStart;
        if (touched) return p.raw; // 拆掉這一段的 ~~,還原成字面文字
        return p.kind === 'struck' ? `~~${p.raw}~~` : p.raw;
      })
      .join('');
  }
  // mode === 'add':classifySelection 已保證 [cleanStart,cleanEnd) 內沒有任何
  // struck 片段(全交疊或不交疊,不會部分切到),所以 before/after 可以直接用
  // serializePiecesRange 保留既有刪除線,中段直接用 clean.slice 當新內文包 ~~。
  const before = serializePiecesRange(pieces, 0, cleanStart);
  const mid = clean.slice(cleanStart, cleanEnd);
  const after = serializePiecesRange(pieces, cleanEnd, clean.length);
  return `${before}~~${mid}~~${after}`;
}

// ── 刪除線:文件層級 wrapper ───────────────────────────────────────────

function applyStrike(doc, lineIndex, cleanStart, cleanEnd) {
  const line = requireEditableLine(doc, lineIndex, 'applyStrike');
  const newBody = toggleStrike(line.bodyRaw, cleanStart, cleanEnd);
  const lines = doc.lines.slice();
  lines[lineIndex] = { ...line, bodyRaw: newBody };
  return { lines };
}

// ── undo 堆疊(2026-08-11:選取穩定後自動套用,原按鈕改「復原」)──────────
//
// History = { stack: Entry[] },Entry = { doc, lineIndex, start, end }。
// 純資料、不含任何 DOM 參照——doc 是套用「這筆操作之前」的完整文件快照,
// lineIndex/start/end 是這筆操作套用當下的邏輯位置(給 UI 換算畫面上復原
// 按鈕該出現在哪裡用)。用快照而不是存反向操作,是因為 toggleStrike 的
// 'remove' 分支在新語意下一次可能拆好幾段刪除線,反向操作不是單純再呼叫
// 一次就能還原;存快照最簡單也保證復原後逐 byte 跟套用前完全相同。
//
// 全部函式都不會改動傳入的 history/doc(回傳新物件),跟這支檔案其餘函式
// 的不可變風格一致。

function createHistory() {
  return { stack: [] };
}

function pushHistory(history, entry) {
  return { stack: [...history.stack, entry] };
}

function popHistory(history) {
  if (history.stack.length === 0) {
    return { history, entry: null };
  }
  const entry = history.stack[history.stack.length - 1];
  const stack = history.stack.slice(0, -1);
  return { history: { stack }, entry };
}

function canUndo(history) {
  return history.stack.length > 0;
}

// 堆疊頂端(最近一次操作)的邏輯位置,不 pop——UI 拿它算復原按鈕要指向
// 畫面上的哪個位置。堆疊空時回 null。
function peekHistory(history) {
  if (history.stack.length === 0) return null;
  const top = history.stack[history.stack.length - 1];
  const out = { lineIndex: top.lineIndex, start: top.start, end: top.end };
  // 軌欄切換沒有「選取範圍」可以貼復原按鈕,UI 要改貼在那顆開關旁邊
  if (top.kind) {
    out.kind = top.kind;
    out.track = top.track;
  }
  return out;
}

// applyStrike + 自動推入歷史的便利包裝。選取不合法一樣丟錯(沿用
// applyStrike/toggleStrike 既有行為),丟錯時不會推入任何東西——
// 呼叫端傳入的 history 物件本身也不會被動到(不可變)。
function applyStrikeWithHistory(doc, history, lineIndex, cleanStart, cleanEnd) {
  const nextDoc = applyStrike(doc, lineIndex, cleanStart, cleanEnd);
  const nextHistory = pushHistory(history, {
    doc,
    lineIndex,
    start: cleanStart,
    end: cleanEnd,
  });
  return { doc: nextDoc, history: nextHistory };
}

// 復原一步。堆疊空時優雅不做事(undone:false,doc 原封不動回傳同一個
// 物件),不丟錯——「復原到底之後再復原」是使用者正常會做的事,不是
// 呼叫端的程式錯誤,跟 requireEditableLine 那種丟錯的情境不同。
function undo(doc, history) {
  const popped = popHistory(history);
  if (popped.entry === null) {
    return { doc, history: popped.history, undone: false };
  }
  return { doc: popped.entry.doc, history: popped.history, undone: true };
}


// ── 室噪留白(`## 🔇`)──────────────────────────────────────────────────
//
// **這是編輯器裡可新增／可刪除的兩種結構行之一**(另一種是 `## 🎵 break`,見 insertBreak),其餘結構行(⚙ ✂ 🎵 opening/ending ➕ 🎬)維持
// 完全唯讀。這是刻意開的一個口,不是放寬整體護欄 —— 開它的理由:「哪裡該留白」
// 只有人審聽得出來,而且既然人可以插,就必須看得到、也刪得掉,否則在手機上插錯
// 沒有退路。要再開第二個口請先想清楚同樣的兩個條件成不成立。
//
// 行格式對齊 render_cut.py 的 ROOMTONE_RE(`^##\s*🔇\s*(.*)$`,第一個 token
// 要 float 得動;秒數省略時由 `## ⚙ template=` 的樣板補)。
const ROOMTONE_LINE_RE = /^##\s*🔇(\s|$)/;

// 手機上不做自由輸入框 —— 打錯的成本(整段留白長度不對)遠高於少幾個選項。
const ROOMTONE_SECONDS = [0.5, 1.0, 1.5, 2.0];

function isRoomtoneLine(doc, lineIndex) {
  const line = doc.lines[lineIndex];
  return !!(line && !line.editable && ROOMTONE_LINE_RE.test(line.raw || ''));
}

// 文件慣用的行尾。插入的新行要跟著它,不能寫死 '\n' —— 否則一份 CRLF 的節目單
// 會被插出一行落單的 LF。
function dominantTerm(doc) {
  for (const line of doc.lines) {
    if (line.term) return line.term;
  }
  return '\n';
}

function insertRoomtone(doc, lineIndex, seconds) {
  requireEditableLine(doc, lineIndex, 'insertRoomtone');
  if (typeof seconds !== 'number' || !Number.isFinite(seconds) || seconds <= 0) {
    throw new Error(
      `cutplan-core: insertRoomtone — 秒數必須是大於 0 的數字,拿到「${seconds}」`,
    );
  }
  const term = dominantTerm(doc);
  const anchor = doc.lines[lineIndex];
  const lines = doc.lines.slice();
  // 錨點若是最後一行且沒有結尾換行,先把換行補給它,新行才不會黏在同一行上。
  if (!anchor.term) {
    lines[lineIndex] = { ...anchor, term };
  }
  lines.splice(lineIndex + 1, 0, {
    editable: false,
    raw: `## 🔇 ${seconds.toFixed(1)}  留白`,
    term: anchor.term ? anchor.term : '',
  });
  return { ...doc, lines };
}

// ── 音樂版本(`## ⚙ … template=<節目>_vN`)───────────────────────────────
//
// 樣板名尾巴的 _vN 決定 opening/break/ending 用 branding-kit 的哪一組音樂
// (show-kit/v1、v2)。編輯器只開這一個口:在 ⚙ 行把 _vN 換成另一個版本;
// 行裡其他任何東西(旋鈕、其他 key)仍唯讀,護欄比對時只忽略這一個數字。
const TEMPLATE_VER_RE = /(template=\S*?_v)(\d+)/;
const TEMPLATE_VERSIONS = ['1', '2'];

function findTemplateLine(doc) {
  for (let i = 0; i < doc.lines.length; i++) {
    const l = doc.lines[i];
    if (!l.editable && /^##\s*⚙/.test(l.raw || '') && TEMPLATE_VER_RE.test(l.raw)) return i;
  }
  return -1;
}

function getTemplateVersion(doc) {
  const i = findTemplateLine(doc);
  return i < 0 ? null : TEMPLATE_VER_RE.exec(doc.lines[i].raw)[2];
}

function setTemplateVersion(doc, version) {
  if (!TEMPLATE_VERSIONS.includes(String(version))) {
    throw new Error(`cutplan-core: setTemplateVersion — 版本只能是 ${TEMPLATE_VERSIONS.join('/')},拿到「${version}」`);
  }
  const i = findTemplateLine(doc);
  if (i < 0) throw new Error('cutplan-core: setTemplateVersion — 這份 cutplan 沒有 `## ⚙ … template=…_vN`');
  const lines = doc.lines.slice();
  lines[i] = { ...lines[i], raw: lines[i].raw.replace(TEMPLATE_VER_RE, `$1${version}`) };
  return { ...doc, lines };
}

// ── 插入間奏(`## 🎵 break`)——編輯器第二個、也是最後一個可增刪的結構行 ──
//
// 只認「整行就是 `## 🎵 break`」:參數(fadein/fadeout/end=…)一律取
// `## ⚙ template=` 的樣板(ADR-2026-09-10-cutplan-template),所以編輯器不需要
// 任何自由輸入,插入後也看得到、刪得掉。帶參數的 break 行、opening、ending
// 仍是唯讀,護欄照舊逐行比。
const BREAK_LINE_RE = /^##\s*🎵\s+break\s*$/;

function isBreakLine(doc, lineIndex) {
  const line = doc.lines[lineIndex];
  return !!(line && !line.editable && BREAK_LINE_RE.test(line.raw || ''));
}

function insertBreak(doc, lineIndex) {
  requireEditableLine(doc, lineIndex, 'insertBreak');
  const term = dominantTerm(doc);
  const anchor = doc.lines[lineIndex];
  const lines = doc.lines.slice();
  if (!anchor.term) lines[lineIndex] = { ...anchor, term };
  lines.splice(lineIndex + 1, 0, {
    editable: false,
    raw: '## 🎵 break',
    term: anchor.term ? anchor.term : '',
  });
  return { ...doc, lines };
}

function removeBreak(doc, lineIndex) {
  if (!isBreakLine(doc, lineIndex)) {
    throw new Error(
      `cutplan-core: removeBreak — 第 ${lineIndex} 行不是單獨一行的 \`## 🎵 break\`,` +
      '只有它可以在編輯器裡刪除',
    );
  }
  const lines = doc.lines.slice();
  lines.splice(lineIndex, 1);
  return { ...doc, lines };
}

function insertBreakWithHistory(doc, history, lineIndex) {
  return {
    doc: insertBreak(doc, lineIndex),
    history: pushHistory(history, { doc, lineIndex, start: 0, end: 0 }),
  };
}

function removeBreakWithHistory(doc, history, lineIndex) {
  return {
    doc: removeBreak(doc, lineIndex),
    history: pushHistory(history, { doc, lineIndex, start: 0, end: 0 }),
  };
}

function removeRoomtone(doc, lineIndex) {
  if (!isRoomtoneLine(doc, lineIndex)) {
    throw new Error(
      `cutplan-core: removeRoomtone — 第 ${lineIndex} 行不是 \`## 🔇\` 室噪行,` +
      '只有室噪行可以在編輯器裡刪除',
    );
  }
  const lines = doc.lines.slice();
  lines.splice(lineIndex, 1);
  return { ...doc, lines };
}

function insertRoomtoneWithHistory(doc, history, lineIndex, seconds) {
  const nextDoc = insertRoomtone(doc, lineIndex, seconds);
  return {
    doc: nextDoc,
    history: pushHistory(history, { doc, lineIndex, start: 0, end: 0 }),
  };
}

function removeRoomtoneWithHistory(doc, history, lineIndex) {
  const nextDoc = removeRoomtone(doc, lineIndex);
  return {
    doc: nextDoc,
    history: pushHistory(history, { doc, lineIndex, start: 0, end: 0 }),
  };
}

// ── 軌欄切換(`## ⚙ … audio=tracks`)──────────────────────────────────
//
// **第二個刻意開的口**,只開「翻 ●/○」這一個動作:欄位有沒有、哪幾軌、順序、
// 格式全部唯讀(那是 tracks_columns.py 產的,改壞了 render 會 FAIL,MM 在手機
// 上不會發現)。開它的理由跟 🔇 同一組條件:①「這段哪幾軌該出聲」只有耳朵
// 聽得出來(串音、笑聲、搶話),預設值只是猜;②翻錯一定看得到(開關就畫在
// 卡片上)、也翻得回來(吃既有的復原)。

function parseTracks(tracksRaw) {
  const m = TRACKS_COL_RE.exec(tracksRaw || '');
  if (!m) return null;
  const out = [];
  const seen = new Set();
  for (const tok of m[1].split(/\s+/).filter(Boolean)) {
    const c = TRACK_CELL_RE.exec(tok);
    if (!c || seen.has(c[1])) return null;
    seen.add(c[1]);
    out.push({ name: c[1], on: c[2] === TRACK_ON });
  }
  return out.length ? out : null;
}

function hasTracksAudio(doc) {
  return doc.lines.some((l) => !l.editable
    && /^##\s*⚙/.test(l.raw || '') && /(^|\s)audio=tracks(\s|$)/.test(l.raw));
}

function toggleTrack(doc, lineIndex, name) {
  const line = requireEditableLine(doc, lineIndex, 'toggleTrack');
  const cells = parseTracks(line.tracksRaw);
  if (!cells) {
    throw new Error(`cutplan-core: toggleTrack — 第 ${lineIndex} 行(${line.id})沒有軌欄`);
  }
  if (!cells.some((c) => c.name === name)) {
    throw new Error(`cutplan-core: toggleTrack — ${line.id} 的軌欄沒有「${name}」這一軌`);
  }
  // 只換那一格的 ●/○ 一個字元,欄位其餘 byte(空白、括號)原樣保留
  const re = new RegExp(`(^|[\\s⟦])(${name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})([●○])`);
  const tracksRaw = line.tracksRaw.replace(re, (_all, pre, n, mk) =>
    pre + n + (mk === TRACK_ON ? TRACK_OFF : TRACK_ON));
  const lines = doc.lines.slice();
  lines[lineIndex] = { ...line, tracksRaw };
  return { ...doc, lines };
}

function toggleTrackWithHistory(doc, history, lineIndex, name) {
  const nextDoc = toggleTrack(doc, lineIndex, name);
  return {
    doc: nextDoc,
    history: pushHistory(history, {
      doc, lineIndex, start: 0, end: 0, kind: 'tracks', track: name,
    }),
  };
}

// ── 波形細剪覆蓋行(`## ✂ 起-迄 wave|audacity` / `## ✚ 起-迄 wave|audacity`)──
//
// Lifov #1201:詞級波形編輯器取代 Audacity 細剪。
// 手動拖拉邊界(包含按住 Alt/Cmd 硬切 AA/BB/CC 成 ABBC)寫入受控的 `## ✂` 與
// `## ✚` 行(tag 為 wave 或 audacity)。render_cut.py 的 apply_review_edges 在
// word_guard / snap_boundaries / pad_seams 全部跑完之後才套用,且 ✚ > ✂ > 自動規則,
// 因此手動覆蓋具有最高優先級。
const MANAGED_EDGE_RE =
  /^##\s*(✂|✚)\uFE0F?\s*([\d:.]+)\s*[-–~]\s*([\d:.]+)\s+(wave|audacity)\s*$/;
const ANY_EDGE_RE =
  /^##\s*(✂|✚)\uFE0F?\s*([\d:.]+)\s*[-–~]\s*([\d:.]+)(?:\s+(.*?))?\s*$/;

function parseEdgeTimeMs(tok) {
  const s = String(tok == null ? '' : tok).trim();
  if (!/^\d+(?:\.\d+)?$|^\d+:\d{1,2}(?:\.\d+)?$|^\d+:\d{1,2}:\d{1,2}(?:\.\d+)?$/.test(s)) {
    return null;
  }
  const parts = s.split(':').map(Number);
  if (parts.some((n) => !Number.isFinite(n) || n < 0)) return null;
  for (let i = 1; i < parts.length; i++) {
    if (parts[i] >= 60) return null;
  }
  const secs = parts.reduce((acc, x) => acc * 60 + x, 0);
  return Math.round(secs * 1000);
}

function formatEdgeTimeSec(ms) {
  return (Math.round(ms) / 1000).toFixed(3);
}

function isReviewEdgeLine(doc, lineIndex) {
  const line = doc.lines[lineIndex];
  if (!line || line.editable) return false;
  const m = MANAGED_EDGE_RE.exec(line.raw || '');
  if (!m) return false;
  const s = parseEdgeTimeMs(m[2]);
  const e = parseEdgeTimeMs(m[3]);
  return s !== null && e !== null && s >= 0 && e > s && e <= 86400000;
}

function checkReviewEdgeLines(doc) {
  let count = 0;
  for (let i = 0; i < doc.lines.length; i++) {
    const l = doc.lines[i];
    if (l.editable) continue;
    const raw = l.raw || '';
    if (!/^##\s*(?:✂|✚)\uFE0F?/.test(raw)) continue;
    // 只針對帶 wave / audacity tag 的管理行驗時間合法性;人類手寫說明的 ✂ 行交給逐行比對守住
    if (/\s+(?:wave|audacity)\s*$/.test(raw)) {
      const m = MANAGED_EDGE_RE.exec(raw);
      if (!m) return `第 ${i + 1} 行 ✂/✚ 格式不合法:${raw}`;
      const s = parseEdgeTimeMs(m[2]);
      const e = parseEdgeTimeMs(m[3]);
      if (s === null || e === null || s < 0 || e <= s || e > 86400000) {
        return `第 ${i + 1} 行 ✂/✚ 時間範圍不合法:${raw}`;
      }
      if (++count > 5000) return '✂/✚ 覆蓋行數超過上限(5000)';
    }
  }
  return null;
}

// ── 三層區間代數(整數毫秒、半開區間 [s, e))────────────────────────────────

function normalizeIntervals(list) {
  if (!Array.isArray(list) || !list.length) return [];
  const xs = [];
  for (const item of list) {
    if (!Array.isArray(item) || item.length < 2) continue;
    const s = Math.round(Number(item[0]));
    const e = Math.round(Number(item[1]));
    if (Number.isFinite(s) && Number.isFinite(e) && e > s) {
      xs.push([s, e]);
    }
  }
  xs.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const out = [];
  for (const [s, e] of xs) {
    const last = out[out.length - 1];
    if (last && s <= last[1]) {
      last[1] = Math.max(last[1], e);
    } else {
      out.push([s, e]);
    }
  }
  return out;
}

function unionIntervals(a, b) {
  return normalizeIntervals([...(a || []), ...(b || [])]);
}

function subtractIntervals(a, b) {
  const src = normalizeIntervals(a);
  const cut = normalizeIntervals(b);
  if (!src.length || !cut.length) return src;
  const out = [];
  let j = 0;
  for (let [s, e] of src) {
    while (j < cut.length && cut[j][1] <= s) j++;
    for (let k = j; k < cut.length && cut[k][0] < e; k++) {
      if (cut[k][0] > s) out.push([s, cut[k][0]]);
      s = Math.max(s, cut[k][1]);
      if (s >= e) break;
    }
    if (s < e) out.push([s, e]);
  }
  return out;
}

function intersectIntervals(a, b) {
  const xs = normalizeIntervals(a);
  const ys = normalizeIntervals(b);
  if (!xs.length || !ys.length) return [];
  const out = [];
  let i = 0;
  let j = 0;
  while (i < xs.length && j < ys.length) {
    const lo = Math.max(xs[i][0], ys[j][0]);
    const hi = Math.min(xs[i][1], ys[j][1]);
    if (hi > lo) out.push([lo, hi]);
    if (xs[i][1] < ys[j][1]) i++;
    else j++;
  }
  return out;
}

// Final = (Base \ Cut) ∪ Keep —— 與 render_cut.py 的 apply_review_edges 完全同構
function computeFinalIntervals(base, overrides) {
  const b = normalizeIntervals(base);
  const cut = normalizeIntervals(overrides && overrides.cut);
  const keep = normalizeIntervals(overrides && overrides.keep);
  return unionIntervals(subtractIntervals(b, cut), keep);
}

// 將單一區間 [s, e) 以 'cut' | 'keep' | 'clear' 套入 overrides,維持 cut ∩ keep = ∅
function applyTrimOverride(overrides, rangeMs, mode) {
  const curCut = normalizeIntervals(overrides && overrides.cut);
  const curKeep = normalizeIntervals(overrides && overrides.keep);
  if (!Array.isArray(rangeMs) || rangeMs.length < 2) {
    return { cut: curCut, keep: curKeep };
  }
  const s = Math.round(Number(rangeMs[0]));
  const e = Math.round(Number(rangeMs[1]));
  if (!Number.isFinite(s) || !Number.isFinite(e) || e <= s) {
    return { cut: curCut, keep: curKeep };
  }
  const R = [[s, e]];
  let cut = subtractIntervals(curCut, R);
  let keep = subtractIntervals(curKeep, R);
  if (mode === 'cut') {
    cut = unionIntervals(cut, R);
  } else if (mode === 'keep') {
    keep = unionIntervals(keep, R);
  } else if (mode !== 'clear') {
    throw new Error(`cutplan-core: applyTrimOverride — 未知的 mode「${mode}」`);
  }
  return { cut, keep };
}

// 強制覆蓋指定範圍(例如詞級為 AA/BB/CC [scopeS, scopeE),硬切成 ABBC [keepS, keepE)):
//   - [scopeS, keepS) → 強制切除 (✂)
//   - [keepS, keepE)  → 強制保留 (✚,壓過詞邊界/刪除線/停頓規則)
//   - [keepE, scopeE) → 強制切除 (✂)
function forceWindowOverride(overrides, scopeRangeMs, keepRangeMs) {
  const scopeS = Math.round(Number(scopeRangeMs[0]));
  const scopeE = Math.round(Number(scopeRangeMs[1]));
  const keepS = Math.max(scopeS, Math.round(Number(keepRangeMs[0])));
  const keepE = Math.min(scopeE, Math.round(Number(keepRangeMs[1])));
  if (!(scopeE > scopeS && keepE > keepS)) {
    throw new Error(
      `cutplan-core: forceWindowOverride — 範圍不合法 scope=[${scopeS},${scopeE}) keep=[${keepS},${keepE})`,
    );
  }
  let next = {
    cut: normalizeIntervals(overrides && overrides.cut),
    keep: normalizeIntervals(overrides && overrides.keep),
  };
  if (keepS > scopeS) {
    next = applyTrimOverride(next, [scopeS, keepS], 'cut');
  }
  next = applyTrimOverride(next, [keepS, keepE], 'keep');
  if (scopeE > keepE) {
    next = applyTrimOverride(next, [keepE, scopeE], 'cut');
  }
  return next;
}

function extractReviewOverrides(doc) {
  const mCut = [];
  const mKeep = [];
  const roCut = [];
  const roKeep = [];
  for (let i = 0; i < doc.lines.length; i++) {
    const l = doc.lines[i];
    if (!l || l.editable) continue;
    const m = ANY_EDGE_RE.exec(l.raw || '');
    if (!m) continue;
    const kind = m[1];
    const s = parseEdgeTimeMs(m[2]);
    const e = parseEdgeTimeMs(m[3]);
    const tag = (m[4] || '').trim();
    if (s === null || e === null || e <= s) continue;
    const isManaged = tag === 'wave' || tag === 'audacity';
    if (isManaged) {
      if (kind === '✂') mCut.push([s, e]);
      else mKeep.push([s, e]);
    } else {
      if (kind === '✂') roCut.push([s, e]);
      else roKeep.push([s, e]);
    }
  }
  const managedKeep = normalizeIntervals(mKeep);
  const managedCut = subtractIntervals(mCut, managedKeep);
  const readonlyKeep = normalizeIntervals(roKeep);
  const readonlyCut = subtractIntervals(roCut, readonlyKeep);
  const allKeep = unionIntervals(managedKeep, readonlyKeep);
  const allCut = subtractIntervals(unionIntervals(managedCut, readonlyCut), allKeep);
  return {
    managed: { cut: managedCut, keep: managedKeep },
    readonly: { cut: readonlyCut, keep: readonlyKeep },
    combined: { cut: allCut, keep: allKeep },
  };
}

function applyReviewOverridesToDoc(doc, overrides, tag = 'wave') {
  if (tag !== 'wave' && tag !== 'audacity') {
    throw new Error(`cutplan-core: applyReviewOverridesToDoc — tag 只能是 wave 或 audacity`);
  }
  const keep = normalizeIntervals(overrides && overrides.keep);
  const cut = subtractIntervals(normalizeIntervals(overrides && overrides.cut), keep);
  const term = dominantTerm(doc);
  const keptLines = doc.lines.filter((_, i) => !isReviewEdgeLine(doc, i)).map((l) => ({ ...l }));
  const newEdgeLines = [
    ...cut.map(([s, e]) => ({
      editable: false,
      raw: `## ✂ ${formatEdgeTimeSec(s)}-${formatEdgeTimeSec(e)} ${tag}`,
      term,
    })),
    ...keep.map(([s, e]) => ({
      editable: false,
      raw: `## ✚ ${formatEdgeTimeSec(s)}-${formatEdgeTimeSec(e)} ${tag}`,
      term,
    })),
  ];
  if (!newEdgeLines.length) {
    return { ...doc, lines: keptLines };
  }
  // 錨點:最後一個 `## ⚙` 行之後;若無則在第一個可編輯 block 行之前;若無則接在檔尾
  let insertAt = -1;
  for (let i = 0; i < keptLines.length; i++) {
    if (!keptLines[i].editable && /^##\s*⚙/.test(keptLines[i].raw || '')) {
      insertAt = i + 1;
    }
  }
  if (insertAt < 0) {
    insertAt = keptLines.findIndex((l) => l.editable);
    if (insertAt < 0) insertAt = keptLines.length;
  }
  if (insertAt > 0 && !keptLines[insertAt - 1].term) {
    keptLines[insertAt - 1] = { ...keptLines[insertAt - 1], term };
  }
  if (insertAt === keptLines.length && doc.lines.length > 0 && !doc.lines[doc.lines.length - 1].term) {
    newEdgeLines[newEdgeLines.length - 1] = {
      ...newEdgeLines[newEdgeLines.length - 1],
      term: '',
    };
  }
  keptLines.splice(insertAt, 0, ...newEdgeLines);
  return { ...doc, lines: keptLines };
}

function applyReviewOverridesWithHistory(doc, history, overrides, tag = 'wave') {
  const nextDoc = applyReviewOverridesToDoc(doc, overrides, tag);
  return {
    doc: nextDoc,
    history: pushHistory(history, { doc, lineIndex: 0, start: 0, end: 0, kind: 'wave-override' }),
  };
}

// ── 全軌與詞級 100% MECE 切分器 ────────────────────────────────────────────
//
// 不變式:
//   1. 區間皆為整數毫秒半開區間 [s, e),且 e > s
//   2. list[0].s === startMs, list[last].e === endMs
//   3. 對所有 k > 0, list[k - 1].e === list[k].s (互斥且窮盡 MECE)

function assertMECE(list, startMs, endMs) {
  if (!Array.isArray(list) || !list.length) {
    return 'MECE 失敗:空序列';
  }
  const s0 = Math.round(Number(startMs));
  const eN = Math.round(Number(endMs));
  if (list[0].s !== s0) {
    return `MECE 失敗:起點未對齊(${list[0].s} !== ${s0})`;
  }
  if (list[list.length - 1].e !== eN) {
    return `MECE 失敗:終點未對齊(${list[list.length - 1].e} !== ${eN})`;
  }
  for (let k = 0; k < list.length; k++) {
    const a = list[k];
    if (!Number.isInteger(a.s) || !Number.isInteger(a.e) || a.e <= a.s) {
      return `MECE 失敗:第 ${k} 項(${a.id || '?'})區間不合法 [${a.s}, ${a.e})`;
    }
    if (k > 0 && list[k - 1].e !== a.s) {
      return `MECE 失敗:${list[k - 1].id || k - 1} 與 ${a.id || k} 邊界不連續(${list[k - 1].e} !== ${a.s})`;
    }
  }
  return null;
}

// 將單一語音 Block [b.s, b.e) 展開為 100% MECE 的詞級子積木 (B0001-1, B0001-2...)
function atomizeBlock(block, words, options = {}) {
  const bs = Math.round(Number(block.s != null ? block.s : block.start * 1000));
  const be = Math.round(Number(block.e != null ? block.e : block.end * 1000));
  const pauseThresholdMs = options.pauseThresholdMs != null ? options.pauseThresholdMs : 250;
  const seamFn = typeof options.seamFn === 'function'
    ? options.seamFn
    : (lo, hi) => Math.round((lo + hi) / 2);

  if (!(be > bs)) {
    throw new Error(`cutplan-core: atomizeBlock — block ${block.id} 長度不合法 [${bs}, ${be})`);
  }

  const matched = [];
  if (Array.isArray(words) && words.length) {
    for (const w of words) {
      const ws = Math.round(Number(w.start) * 1000);
      const we = Math.round(Number(w.end) * 1000);
      if (!Number.isFinite(ws) || !Number.isFinite(we) || we <= ws) continue;
      const mid = (ws + we) / 2;
      const ov = Math.min(be, we) - Math.max(bs, ws);
      if ((mid >= bs && mid <= be) || ov > 0.5 * (we - ws)) {
        const cs = Math.max(bs, Math.min(be - 1, ws));
        const ce = Math.max(cs + 1, Math.min(be, we));
        matched.push({ text: String(w.word || ''), s: cs, e: ce });
      }
    }
  }

  matched.sort((a, b) => a.s - b.s || a.e - b.e);

  if (!matched.length) {
    return [{
      id: `${block.id}-1`,
      blockId: block.id,
      wordIndex: 1,
      kind: 'word',
      text: String(block.text || ''),
      s: bs,
      e: be,
    }];
  }

  // 確保每個詞嚴格遞增且落在 [bs, be] 內
  const rawWords = [];
  for (let i = 0; i < matched.length; i++) {
    const w = { ...matched[i], wordIndex: i + 1 };
    rawWords.push(w);
  }

  // 解微重疊與微小空隙,建立 MECE 子積木
  const atoms = [];
  const headGap = rawWords[0].s - bs;
  if (headGap >= pauseThresholdMs) {
    atoms.push({
      id: `${block.id}-^`,
      blockId: block.id,
      kind: 'silence',
      text: '',
      s: bs,
      e: rawWords[0].s,
    });
  } else {
    rawWords[0].s = bs;
  }

  for (let i = 0; i < rawWords.length - 1; i++) {
    const a = rawWords[i];
    const b = rawWords[i + 1];
    if (a.e <= a.s) a.e = Math.min(be, a.s + 1);
    if (a.e > b.s) {
      // Whisper 時間戳微重疊 → 取能量谷底或中點接齊
      const lo = Math.max(a.s + 1, b.s);
      const hi = Math.min(a.e, b.e - 1);
      const seam = hi >= lo ? Math.max(lo, Math.min(hi, seamFn(lo, hi))) : Math.max(a.s + 1, Math.min(be - 1, Math.round((a.s + b.e) / 2)));
      a.e = seam;
      b.s = seam;
      atoms.push({
        id: `${block.id}-${a.wordIndex}`,
        blockId: block.id,
        wordIndex: a.wordIndex,
        kind: 'word',
        text: a.text,
        s: a.s,
        e: a.e,
      });
    } else if (b.s - a.e < pauseThresholdMs) {
      // 微小詞間空隙(< pauseThresholdMs) → 直接接齊讓 AA/BB/CC 緊密連續 MECE
      const seam = Math.max(a.e, Math.min(b.s, seamFn(a.e, b.s)));
      a.e = seam;
      b.s = seam;
      atoms.push({
        id: `${block.id}-${a.wordIndex}`,
        blockId: block.id,
        wordIndex: a.wordIndex,
        kind: 'word',
        text: a.text,
        s: a.s,
        e: a.e,
      });
    } else {
      // 顯著詞間停頓 → 獨立為靜音子積木
      atoms.push({
        id: `${block.id}-${a.wordIndex}`,
        blockId: block.id,
        wordIndex: a.wordIndex,
        kind: 'word',
        text: a.text,
        s: a.s,
        e: a.e,
      });
      atoms.push({
        id: `${block.id}-${a.wordIndex}~${b.wordIndex}`,
        blockId: block.id,
        kind: 'silence',
        text: '',
        s: a.e,
        e: b.s,
      });
    }
  }

  const lastW = rawWords[rawWords.length - 1];
  if (lastW.s >= be) lastW.s = be - 1;
  const tailGap = be - lastW.e;
  if (tailGap >= pauseThresholdMs && lastW.e > lastW.s) {
    atoms.push({
      id: `${block.id}-${lastW.wordIndex}`,
      blockId: block.id,
      wordIndex: lastW.wordIndex,
      kind: 'word',
      text: lastW.text,
      s: lastW.s,
      e: lastW.e,
    });
    atoms.push({
      id: `${block.id}-$`,
      blockId: block.id,
      kind: 'silence',
      text: '',
      s: lastW.e,
      e: be,
    });
  } else {
    lastW.e = be;
    atoms.push({
      id: `${block.id}-${lastW.wordIndex}`,
      blockId: block.id,
      wordIndex: lastW.wordIndex,
      kind: 'word',
      text: lastW.text,
      s: lastW.s,
      e: lastW.e,
    });
  }

  // 安全修復:若有極端擠壓導致 e <= s 的退化項,併入相鄰項以保證 100% MECE
  const clean = [];
  for (const item of atoms) {
    if (item.e <= item.s) continue;
    if (clean.length && clean[clean.length - 1].e !== item.s) {
      item.s = clean[clean.length - 1].e;
    }
    if (item.e > item.s) clean.push(item);
  }
  if (!clean.length) {
    clean.push({
      id: `${block.id}-1`,
      blockId: block.id,
      wordIndex: 1,
      kind: 'word',
      text: String(block.text || ''),
      s: bs,
      e: be,
    });
  } else {
    clean[0].s = bs;
    clean[clean.length - 1].e = be;
  }
  return clean;
}

// 將整軌 [0, durationMs) 的 blocks 與 gaps 正規化為 100% MECE 時間軸
function buildTrackPartition(cutplanData, words = [], durationMs = null, options = {}) {
  const rawBlocks = (cutplanData && Array.isArray(cutplanData.blocks)) ? cutplanData.blocks : [];
  const rawGaps = (cutplanData && Array.isArray(cutplanData.gaps)) ? cutplanData.gaps : [];
  const seamFn = typeof options.seamFn === 'function'
    ? options.seamFn
    : (lo, hi) => Math.round((lo + hi) / 2);

  let maxMs = durationMs != null ? Math.round(Number(durationMs)) : 0;
  for (const b of rawBlocks) {
    const e = Math.round(Number(b.end) * 1000);
    if (Number.isFinite(e) && e > maxMs) maxMs = e;
  }
  for (const g of rawGaps) {
    const e = Math.round(Number(g.end) * 1000);
    if (Number.isFinite(e) && e > maxMs) maxMs = e;
  }
  if (Array.isArray(words)) {
    for (const w of words) {
      const e = Math.round(Number(w.end) * 1000);
      if (Number.isFinite(e) && e > maxMs) maxMs = e;
    }
  }
  if (maxMs <= 0) maxMs = 1000;

  const speech = [];
  for (const b of rawBlocks) {
    const s = Math.max(0, Math.min(maxMs, Math.round(Number(b.start) * 1000)));
    const e = Math.max(0, Math.min(maxMs, Math.round(Number(b.end) * 1000)));
    if (e > s) {
      speech.push({
        id: String(b.id),
        kind: 'speech',
        s,
        e,
        speaker: b.speaker || '',
        text: b.text || '',
      });
    }
  }
  speech.sort((a, b) => a.s - b.s || a.e - b.e);

  // ① 解相鄰語音 block 的微重疊
  for (let i = 0; i < speech.length - 1; i++) {
    const cur = speech[i];
    const nxt = speech[i + 1];
    if (cur.e > nxt.s) {
      const lo = Math.max(cur.s + 1, nxt.s);
      const hi = Math.min(cur.e, nxt.e - 1);
      const seam = hi >= lo
        ? Math.max(lo, Math.min(hi, seamFn(lo, hi)))
        : Math.max(cur.s + 1, Math.min(nxt.e - 1, Math.round((cur.s + nxt.e) / 2)));
      cur.e = seam;
      nxt.s = seam;
    }
  }

  const validSpeech = speech.filter((b) => b.e > b.s);
  const legacyGaps = rawGaps
    .map((g) => ({
      id: String(g.id),
      s: Math.round(Number(g.start) * 1000),
      e: Math.round(Number(g.end) * 1000),
    }))
    .filter((g) => Number.isFinite(g.s) && Number.isFinite(g.e) && g.e > g.s);

  const attachGapMeta = (s, e, fallbackId) => {
    const hits = [];
    for (const g of legacyGaps) {
      const ov = Math.min(e, g.e) - Math.max(s, g.s);
      if (ov > 0) hits.push({ id: g.id, ov });
    }
    hits.sort((a, b) => b.ov - a.ov);
    const legacyIds = hits.map((h) => h.id);
    const primaryGapId = legacyIds[0] || null;
    const dur = e - s;
    const tags = [];
    if (s === 0) tags.push('head');
    if (e === maxMs) tags.push('tail');
    if (dur >= 2000) tags.push('G');
    else if (dur > 900) tags.push('P');
    else tags.push('p');
    const id = primaryGapId || fallbackId;
    return {
      id,
      fallbackId,
      primaryGapId,
      legacyIds,
      tags,
      kind: 'silence',
      s,
      e,
      text: '',
      atoms: [{
        id: `${id}-1`,
        blockId: id,
        wordIndex: 1,
        kind: 'silence',
        text: '',
        s,
        e,
      }],
    };
  };

  // ② 補齊所有空洞 [0, maxMs)
  const blocks = [];
  let cur = 0;
  let prevSpeechId = '^';
  for (const b of validSpeech) {
    if (b.s > cur) {
      const fbId = prevSpeechId === '^' ? '~^' : `~${prevSpeechId}`;
      blocks.push(attachGapMeta(cur, b.s, fbId));
    }
    const atoms = atomizeBlock(b, words, options);
    blocks.push({
      ...b,
      legacyIds: [b.id],
      tags: ['B'],
      atoms,
    });
    cur = b.e;
    prevSpeechId = b.id;
  }
  if (cur < maxMs) {
    const fbId = validSpeech.length ? '~$' : '~^';
    blocks.push(attachGapMeta(cur, maxMs, fbId));
  }

  const allAtoms = [];
  for (const b of blocks) {
    for (const a of b.atoms) allAtoms.push(a);
  }

  return {
    durationMs: maxMs,
    blocks,
    allAtoms,
  };
}

// 依 cutplan.md 勾選與刪除線 + MECE partition 計算即時 Base 保留區間 (pre-review)
function computeBaseIntervalsFromDoc(doc, partition, options = {}) {
  if (!doc || !partition || !Array.isArray(partition.blocks)) return [];
  const pauseKeepMs = options.pauseKeepMs != null ? options.pauseKeepMs : 600;
  const byId = new Map();
  for (const l of doc.lines) {
    if (l && l.editable && l.id) {
      // 正片列優先(集錦在前、正片在後,後者覆蓋前者)
      byId.set(l.id, l);
    }
  }

  const kept = [];
  const blocks = partition.blocks;
  for (let idx = 0; idx < blocks.length; idx++) {
    const b = blocks[idx];
    if (b.kind === 'speech') {
      const line = byId.get(b.id);
      const isChecked = line ? line.mark !== ' ' : true;
      if (!isChecked) continue;

      let ranges = [[b.s, b.e]];
      if (line && /~~/.test(line.bodyRaw || '') && Array.isArray(b.atoms) && b.atoms.length) {
        const { clean, pieces } = splitStrikes(line.bodyRaw);
        const struckSpans = pieces.filter((p) => p.kind === 'struck');
        if (struckSpans.length && clean.length > 0) {
          const wordAtoms = b.atoms.filter((a) => a.kind === 'word');
          // 將字元位置對應到 word atoms
          const totalWordChars = wordAtoms.reduce((acc, a) => acc + (a.text ? a.text.length : 1), 0) || 1;
          let charCursor = 0;
          const struckIntervals = [];
          for (const wa of wordAtoms) {
            const wLen = Math.max(1, (wa.text || '').length);
            const wStartRatio = charCursor / totalWordChars;
            const wEndRatio = (charCursor + wLen) / totalWordChars;
            const cleanStart = wStartRatio * clean.length;
            const cleanEnd = wEndRatio * clean.length;
            charCursor += wLen;
            for (const sp of struckSpans) {
              const ov = Math.min(cleanEnd, sp.cleanEnd) - Math.max(cleanStart, sp.cleanStart);
              if (ov > 0.3 * (cleanEnd - cleanStart)) {
                struckIntervals.push([wa.s, wa.e]);
                break;
              }
            }
          }
          if (struckIntervals.length) {
            ranges = subtractIntervals(ranges, struckIntervals);
          }
        }
      }
      for (const r of ranges) kept.push(r);
    } else if (b.kind === 'silence') {
      // 檢查是否有對應的 G 或 P 列
      let matchedLine = null;
      for (const lid of (b.legacyIds || [b.id])) {
        if (byId.has(lid)) {
          matchedLine = byId.get(lid);
          break;
        }
      }
      if (matchedLine) {
        const isChecked = matchedLine.mark !== ' ';
        if (/^G\d/.test(matchedLine.id)) {
          if (isChecked) kept.push([b.s, b.e]);
        } else if (/^P\d/.test(matchedLine.id)) {
          if (isChecked) {
            kept.push([b.s, b.e]);
          } else if (pauseKeepMs > 0) {
            kept.push([b.s, Math.min(b.e, b.s + pauseKeepMs)]);
          }
        }
      } else {
        // 未顯式列出的短句間停頓(< 900ms):若前後相鄰的語音 block 都有勾選,預設保留自然換氣
        const prevB = idx > 0 ? blocks[idx - 1] : null;
        const nextB = idx + 1 < blocks.length ? blocks[idx + 1] : null;
        const prevChecked = prevB && prevB.kind === 'speech' && byId.get(prevB.id)?.mark !== ' ';
        const nextChecked = nextB && nextB.kind === 'speech' && byId.get(nextB.id)?.mark !== ' ';
        if (prevChecked && nextChecked && (b.e - b.s) <= 900) {
          kept.push([b.s, b.e]);
        }
      }
    }
  }
  return normalizeIntervals(kept);
}

// ── SoundCraft 移植:Peaks 多解析度金字塔 + 谷底接縫 + Smart Trim 吸附 ─────────
//
// 參考 storytold/soundcraft crates/audio-io/src/peaks.rs 與 crates/ui-egui/src/edit_window/drag.rs:
//   - Level 0 每 PEAKS_BLOCK=32 samples 聚合一次 min / max / squares
//   - Level k 每 PEAKS_FANOUT=4 個下層 block 聚合一次
//   - 任意縮放倍率的像素區間查詢 [startSample, endSample) 皆為 O(log N)

const PEAKS_BLOCK = 32;
const PEAKS_FANOUT = 4;

function buildPeaks(samples) {
  const len = samples ? samples.length : 0;
  let n = Math.ceil(len / PEAKS_BLOCK);
  const levels = [];
  if (n === 0) {
    return { len: 0, levels: [] };
  }
  const mn0 = new Float32Array(n);
  const mx0 = new Float32Array(n);
  const sq0 = new Float64Array(n);
  for (let b = 0; b < n; b++) {
    let lo = Infinity;
    let hi = -Infinity;
    let s2 = 0;
    const end = Math.min(len, (b + 1) * PEAKS_BLOCK);
    for (let i = b * PEAKS_BLOCK; i < end; i++) {
      const v = samples[i];
      if (v < lo) lo = v;
      if (v > hi) hi = v;
      if (v === v) s2 += v * v;
    }
    mn0[b] = lo <= hi ? lo : 0;
    mx0[b] = lo <= hi ? hi : 0;
    sq0[b] = s2;
  }
  levels.push({ mn: mn0, mx: mx0, sq: sq0 });

  while (n > 1) {
    const m = Math.ceil(n / PEAKS_FANOUT);
    const prev = levels[levels.length - 1];
    const mn = new Float32Array(m);
    const mx = new Float32Array(m);
    const sq = new Float64Array(m);
    for (let b = 0; b < m; b++) {
      let lo = Infinity;
      let hi = -Infinity;
      let s2 = 0;
      const end = Math.min(n, (b + 1) * PEAKS_FANOUT);
      for (let i = b * PEAKS_FANOUT; i < end; i++) {
        if (prev.mn[i] < lo) lo = prev.mn[i];
        if (prev.mx[i] > hi) hi = prev.mx[i];
        s2 += prev.sq[i];
      }
      mn[b] = lo <= hi ? lo : 0;
      mx[b] = lo <= hi ? hi : 0;
      sq[b] = s2;
    }
    levels.push({ mn, mx, sq });
    n = m;
  }
  return { len, levels };
}

function queryPeaksMinMax(peaks, samples, startSample, endSample) {
  if (!peaks || !samples || !peaks.len) return [0, 0];
  const s = Math.max(0, Math.floor(startSample));
  const e = Math.min(peaks.len, samples.length, Math.ceil(endSample));
  if (s >= e) return [0, 0];

  let lo = Infinity;
  let hi = -Infinity;
  const rawRange = (a, b) => {
    for (let i = a; i < b; i++) {
      const v = samples[i];
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
  };

  const first = Math.ceil(s / PEAKS_BLOCK);
  const last = Math.floor(e / PEAKS_BLOCK);
  if (first >= last) {
    rawRange(s, e);
  } else {
    rawRange(s, first * PEAKS_BLOCK);
    rawRange(last * PEAKS_BLOCK, e);
    let l = first;
    let h = last;
    for (let lvl = 0; lvl < peaks.levels.length; lvl++) {
      const { mn, mx } = peaks.levels[lvl];
      const addBlock = (idx) => {
        if (mn[idx] < lo) lo = mn[idx];
        if (mx[idx] > hi) hi = mx[idx];
      };
      if (lvl + 1 === peaks.levels.length || h - l < 2 * PEAKS_FANOUT) {
        for (let i = l; i < h; i++) addBlock(i);
        break;
      }
      while (l % PEAKS_FANOUT !== 0) addBlock(l++);
      while (h % PEAKS_FANOUT !== 0) addBlock(--h);
      l = Math.floor(l / PEAKS_FANOUT);
      h = Math.floor(h / PEAKS_FANOUT);
    }
  }
  return lo > hi ? [0, 0] : [lo, hi];
}

function queryPeaksRms(peaks, samples, startSample, endSample) {
  if (!peaks || !samples || !peaks.len) return 0;
  const s = Math.max(0, Math.floor(startSample));
  const e = Math.min(peaks.len, samples.length, Math.ceil(endSample));
  if (s >= e) return 0;

  let sumSq = 0;
  const rawRange = (a, b) => {
    for (let i = a; i < b; i++) {
      const v = samples[i];
      if (v === v) sumSq += v * v;
    }
  };

  const first = Math.ceil(s / PEAKS_BLOCK);
  const last = Math.floor(e / PEAKS_BLOCK);
  if (first >= last) {
    rawRange(s, e);
  } else {
    rawRange(s, first * PEAKS_BLOCK);
    rawRange(last * PEAKS_BLOCK, e);
    let l = first;
    let h = last;
    for (let lvl = 0; lvl < peaks.levels.length; lvl++) {
      const { sq } = peaks.levels[lvl];
      if (lvl + 1 === peaks.levels.length || h - l < 2 * PEAKS_FANOUT) {
        for (let i = l; i < h; i++) sumSq += sq[i];
        break;
      }
      while (l % PEAKS_FANOUT !== 0) sumSq += sq[l++];
      while (h % PEAKS_FANOUT !== 0) sumSq += sq[--h];
      l = Math.floor(l / PEAKS_FANOUT);
      h = Math.floor(h / PEAKS_FANOUT);
    }
  }
  return Math.sqrt(sumSq / (e - s));
}

// 在 [loMs, hiMs] 內以 stepMs=5ms 滑動,利用 Peaks 尋找 RMS 能量最低的谷底作為切點
function findValleySeamMs(peaks, samples, sampleRate, loMs, hiMs, stepMs = 5) {
  const lo = Math.round(Number(loMs));
  const hi = Math.round(Number(hiMs));
  if (!(hi > lo)) return lo;
  const mid = Math.round((lo + hi) / 2);
  if (!peaks || !samples || !sampleRate || hi - lo < stepMs) return mid;

  let bestMs = mid;
  let bestRms = Infinity;
  let bestDist = Infinity;
  const winHalf = Math.max(2, Math.round(stepMs / 2));

  for (let t = lo; t <= hi; t += stepMs) {
    const s0 = Math.round(((t - winHalf) / 1000) * sampleRate);
    const s1 = Math.round(((t + winHalf) / 1000) * sampleRate);
    const rms = queryPeaksRms(peaks, samples, s0, s1);
    const dist = Math.abs(t - mid);
    if (rms < bestRms - 1e-9 || (Math.abs(rms - bestRms) <= 1e-9 && dist < bestDist)) {
      bestRms = rms;
      bestMs = t;
      bestDist = dist;
    }
  }
  return Math.max(lo, Math.min(hi, bestMs));
}

// 二分搜尋最近吸附點(snapPointsMs 需已升冪排序)
function findNearestSnapMs(snapPointsMs, targetMs) {
  if (!snapPointsMs || !snapPointsMs.length) return Math.round(targetMs);
  let lo = 0;
  let hi = snapPointsMs.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (snapPointsMs[mid] < targetMs) lo = mid + 1;
    else hi = mid;
  }
  let best = snapPointsMs[lo];
  if (lo > 0 && Math.abs(snapPointsMs[lo - 1] - targetMs) <= Math.abs(best - targetMs)) {
    best = snapPointsMs[lo - 1];
  }
  return best;
}

// 移植自 SoundCraft drag.rs 的 trim_drag_snap:
//   - 預設硬吸附 words.json 詞邊界 (snapPointsMs)
//   - 按住修飾鍵 (Alt/Option 或 Cmd/Ctrl) 反轉為 1ms 自由滑動 (Slip Mode)
//   - 距離原點 <= originSnapPx (預設 6px) 自動磁吸回原點防呆
//   - 最小保留長度 minKeepMs (預設 30ms) clamp
function trimDragSnap(gesture, atMs, options = {}) {
  const snapEnabled = options.snapEnabled !== false;
  const modifierHeld = !!options.modifierHeld;
  const snapOn = snapEnabled !== modifierHeld;
  const minKeepMs = options.minKeepMs != null ? options.minKeepMs : 30;
  const durMs = options.durMs != null ? options.durMs : 86400000;
  const pxPerMs = options.pxPerMs != null ? options.pxPerMs : 0;
  const originSnapPx = options.originSnapPx != null ? options.originSnapPx : 6;

  let to = snapOn
    ? findNearestSnapMs(gesture.snapPointsMs, atMs)
    : Math.round(atMs);

  if (gesture.originMs != null && pxPerMs > 0) {
    if (Math.abs(to - gesture.originMs) * pxPerMs <= originSnapPx) {
      to = gesture.originMs;
    }
  }

  if (gesture.kind === 'trimStart') {
    const lo = gesture.minMs != null ? gesture.minMs : 0;
    const hi = (gesture.regionEndMs != null ? gesture.regionEndMs : durMs) - minKeepMs;
    return Math.max(lo, Math.min(hi, to));
  }
  if (gesture.kind === 'trimEnd') {
    const lo = (gesture.regionStartMs != null ? gesture.regionStartMs : 0) + minKeepMs;
    const hi = gesture.maxMs != null ? gesture.maxMs : durMs;
    return Math.max(lo, Math.min(hi, to));
  }
  return Math.max(0, Math.min(durMs, to));
}

// ── 一鍵剪輯範圍 Playback 排程與游標映射 (#1220 M3) ─────────────────────────
//
// 依 Final 保留區間 [[sMs, eMs], ...] 產生無縫跳過切除段的播放清單:
//   - 若起點 startFromSrcMs 落在被切除區間,自動跳至下一段保留區間起點
//   - 支援 maxToSrcMs(用於接縫前後 ±1.5s 試聽或選取區試聽)
//   - 每段帶 fadeInMs / fadeOutMs (預設 4ms 微淡入淡出防切點爆音)

function buildCutPlaylist(finalIntervalsMs, options = {}) {
  const norm = normalizeIntervals(finalIntervalsMs);
  const startFrom = options.startFromSrcMs != null ? Math.max(0, Math.round(Number(options.startFromSrcMs))) : 0;
  const maxTo = options.maxToSrcMs != null ? Math.round(Number(options.maxToSrcMs)) : Infinity;
  const fadeMs = options.fadeMs != null ? Math.max(0, Number(options.fadeMs)) : 4;

  const playlist = [];
  let dstCursorMs = 0;

  for (let i = 0; i < norm.length; i++) {
    const [segS, segE] = norm[i];
    if (segE <= startFrom) continue;
    if (segS >= maxTo) break;
    const s = Math.max(segS, startFrom);
    const e = Math.min(segE, maxTo);
    const dur = e - s;
    if (dur <= 0) continue;
    const effFade = Math.min(fadeMs, Math.floor(dur / 2));
    playlist.push({
      index: playlist.length,
      srcStartMs: s,
      srcEndMs: e,
      durationMs: dur,
      dstStartMs: dstCursorMs,
      dstEndMs: dstCursorMs + dur,
      fadeInMs: effFade,
      fadeOutMs: effFade,
    });
    dstCursorMs += dur;
  }
  return playlist;
}

// 將播放經過時間 elapsedMs 映射回原始音軌時間 srcMs(跨切點自動跳躍)
function mapPlaybackTimeToSourceMs(playlist, elapsedMs) {
  if (!Array.isArray(playlist) || !playlist.length) {
    return { playing: false, srcMs: null, dstMs: 0, segmentIndex: -1 };
  }
  const t = Math.max(0, Number(elapsedMs) || 0);
  const last = playlist[playlist.length - 1];
  if (t >= last.dstEndMs) {
    return {
      playing: false,
      srcMs: last.srcEndMs,
      dstMs: last.dstEndMs,
      segmentIndex: playlist.length - 1,
    };
  }
  for (let i = 0; i < playlist.length; i++) {
    const seg = playlist[i];
    if (t >= seg.dstStartMs && t < seg.dstEndMs) {
      const offset = t - seg.dstStartMs;
      return {
        playing: true,
        srcMs: seg.srcStartMs + offset,
        dstMs: t,
        segmentIndex: i,
      };
    }
  }
  return {
    playing: true,
    srcMs: playlist[0].srcStartMs,
    dstMs: 0,
    segmentIndex: 0,
  };
}

// ── 唯讀護欄(伺服端第二道防線;Code.gs 的 saveCutplan 呼叫它)────────
//
// 逐行比對 oldContent → newContent,回傳第一個「超出允許編輯範圍」的說明字串,
// 沒問題回 null。允許:block 行的 mark、block 內文「拿掉 ~~ 之後的文字不變」、
// (⚙ 有 audio=tracks 時)軌欄只翻 ●/○;其他任何差異一律不合法。
// 從 Code.gs 搬來這裡是為了讓 Node 測試守得到(規則本身沒改)。

function trackSkeleton(tracksRaw) {
  return (tracksRaw || '').replace(/[●○]/g, '?');
}

function findIllegalEdit(oldContent, newContent) {
  const parsedNew = parseCutplan(newContent);
  const edgeErr = checkReviewEdgeLines(parsedNew);
  if (edgeErr) return edgeErr;
  // 留白行(## 🔇)、單獨一行的間奏(## 🎵 break)、與受控波形覆蓋行(## ✂/✚ ... wave|audacity)
  // 是編輯器可增刪的結構行,比對前兩邊都拿掉;其餘行照原規則逐行比。
  // 拿掉後的行數不同,代表動了別的結構行。
  const dropEditorLines = (doc) => ({
    ...doc,
    lines: doc.lines.filter(
      (_, i) => !isRoomtoneLine(doc, i) && !isBreakLine(doc, i) && !isReviewEdgeLine(doc, i),
    ),
  });
  const oldDoc = dropEditorLines(parseCutplan(oldContent));
  const newDoc = dropEditorLines(parsedNew);
  if (oldDoc.lines.length !== newDoc.lines.length) {
    return `行數不一致(${oldDoc.lines.length} → ${newDoc.lines.length})`;
  }
  const tracksOk = hasTracksAudio(oldDoc);
  for (let i = 0; i < oldDoc.lines.length; i++) {
    const a = oldDoc.lines[i];
    const b = newDoc.lines[i];
    const n = i + 1;
    if (a.editable !== b.editable) {
      return `第 ${n} 行的可編輯性改變了(唯讀 ↔ 可編輯)`;
    }
    if (!a.editable) {
      const sameRaw = a.raw === b.raw || (
        TEMPLATE_VER_RE.test(a.raw) && TEMPLATE_VER_RE.test(b.raw)
        && a.raw.replace(TEMPLATE_VER_RE, '$1#') === b.raw.replace(TEMPLATE_VER_RE, '$1#')
        && TEMPLATE_VERSIONS.includes(TEMPLATE_VER_RE.exec(b.raw)[2]));
      if (!sameRaw || a.term !== b.term) {
        return `第 ${n} 行是唯讀行,但內容被改動了`;
      }
      continue;
    }
    if (a.id !== b.id || a.timecode !== b.timecode
        || a.prefix !== b.prefix || a.reason !== b.reason || a.term !== b.term) {
      return `第 ${n} 行(${a.id})的 id/時間碼/speaker/理由被改動了`;
    }
    if (a.tracksRaw !== b.tracksRaw) {
      if (!a.tracksRaw || !b.tracksRaw) {
        return `第 ${n} 行(${a.id})的軌欄被新增或刪除了(只能切換 ●/○)`;
      }
      if (!tracksOk) {
        return `第 ${n} 行(${a.id})的軌欄被改動了,但 ⚙ 沒寫 audio=tracks`;
      }
      if (trackSkeleton(a.tracksRaw) !== trackSkeleton(b.tracksRaw)
          || !parseTracks(b.tracksRaw)) {
        return `第 ${n} 行(${a.id})的軌欄軌名/順序/格式被改動了(只能切換 ●/○)`;
      }
    }
    if (a.bodyRaw !== b.bodyRaw) {
      const cleanA = splitStrikes(a.bodyRaw).clean;
      const cleanB = splitStrikes(b.bodyRaw).clean;
      if (cleanA !== cleanB) {
        return `第 ${n} 行(${a.id})的逐字稿文字被改動了(只能加/去刪除線)`;
      }
    }
  }
  return null;
}

// ── 成品時間對照(cutplan.timeline.json,Lifov #1078)──────────────────
//
// render 出片時在 cutplan.md 旁產 timeline:block id → 成品起點秒數陣列,或
// null=成品裡沒有。判定是 render 看**實際保留範圍**算的,不是看勾選——所以
// 「勾了卻沒出現」「取消卻仍出現」在這裡才看得到。timeline 是另一個檔,編輯器
// 只讀不寫,唯讀護欄不受影響。

function parseTimeline(text) {
  if (!text || typeof text !== 'string') return null;
  let d;
  try {
    d = JSON.parse(text);
  } catch (e) {
    return null;
  }
  if (!d || typeof d !== 'object' || !d.blocks || typeof d.blocks !== 'object'
      || Array.isArray(d.blocks)) {
    return null;
  }
  // 每一列都要合格(null 或有限非負數字陣列),任一不合格整份不採信(驗收 TL-2):
  // 部分採信會讓「v3 未出現」這種結論建立在壞資料上,MM 看不出哪幾列是假的
  const okNum = (v) => typeof v === 'number' && Number.isFinite(v) && v >= 0;
  for (const v of Object.values(d.blocks)) {
    if (v !== null && !(Array.isArray(v) && v.every(okNum))) return null;
  }
  // 欄位不存在=舊版 timeline,走舊行為;明寫了就必須合法(null 也不行,TL-2-1)
  const hasFd = Object.prototype.hasOwnProperty.call(d, 'final_duration_secs');
  const fd = d.final_duration_secs;
  if (hasFd && !okNum(fd)) return null;
  const version = String(d.version || '');
  return {
    version,
    versionShort: version.split('_')[0] || version,
    generatedAt: String(d.generated_at || ''),
    finalDuration: hasFd ? fd : null,
    blocks: d.blocks,
  };
}

// loadCutplan 回來的 timeline 字串 → 'absent'(沒有這個檔)/'bad'(有檔但空白
// 或格式不合格)/'ok'。空白檔也是「有檔」,要顯示格式錯誤(TL-2-2),不能當沒檔。
function timelineFileState(text) {
  if (text === null || text === undefined) return 'absent';
  return parseTimeline(text) ? 'ok' : 'bad';
}

// findLineAtTime 的「超出成品長度」結果(驗收 TL-1):UI 要說「成品只有 43:28」,
// 不能默默跳到最後一張卡讓人以為那裡就是。
const OUT_OF_RANGE = 'out-of-range';

// 「12:34」「754」「1:02:03」「12:34.5」→ 秒;格式看不懂回 null(不猜)。
// 前面帶一個負號(「-1」「-0:10」)照樣解析成負數 —— 那是「超出範圍」,不是
// 「看不懂」,UI 要講對原因(驗收 TL-1-1)。
function parseTimeInput(text) {
  let s = String(text == null ? '' : text).trim();
  const neg = s.startsWith('-');
  if (neg) s = s.slice(1);
  if (!/^\d+(?:\.\d+)?$|^\d+:\d{1,2}(?:\.\d+)?$|^\d+:\d{1,2}:\d{1,2}(?:\.\d+)?$/.test(s)) {
    return null;
  }
  const parts = s.split(':').map(Number);
  for (let i = 1; i < parts.length; i++) {
    if (parts[i] >= 60) return null;
  }
  const v = parts.reduce((acc, x) => acc * 60 + x, 0);
  return neg ? -v : v;
}

function formatTime(secs) {
  const t = Math.floor(Math.max(0, secs));
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = String(t % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
}

// 卡片上的小字與不一致判定;timeline 沒有這一列(或沒有 timeline)回 null。
function timelineStatus(line, timeline, overrides = null) {
  if (!timeline || !line || !line.editable) return null;
  // P 停頓列:不勾=收緊、勾=原長保留,兩種狀態成品裡都有,只差長度——不是「剪掉/留下」
  // 的二元決定,比對有沒有出現沒有意義(EP22 v7 的 32 筆假「未 apply」都是它)。
  if (/^P\d/.test(line.id)) return null;
  if (!Object.prototype.hasOwnProperty.call(timeline.blocks, line.id)) return null;
  const times = timeline.blocks[line.id];
  const present = Array.isArray(times) && times.length > 0;
  const checked = line.mark !== ' ';
  let coveredByManualOverride = false;
  if (overrides && line.timecode) {
    const parts = String(line.timecode).split(/[-–~]/);
    if (parts.length === 2) {
      const bs = parseEdgeTimeMs(parts[0]);
      const be = parseEdgeTimeMs(parts[1]);
      if (bs !== null && be !== null && be > bs) {
        if (checked && !present && Array.isArray(overrides.cut)) {
          coveredByManualOverride = intersectIntervals([[bs, be]], overrides.cut).length > 0;
        } else if (!checked && present && Array.isArray(overrides.keep)) {
          coveredByManualOverride = intersectIntervals([[bs, be]], overrides.keep).length > 0;
        }
      }
    }
  }
  return {
    times: present ? times : null,
    label: present
      ? `▶ ${timeline.versionShort} ${times.map(formatTime).join(' · ')}`
      : `${timeline.versionShort} 未出現`,
    // 勾選但帶刪除線或有 ✂ 手動覆蓋:只剪掉一部分字、其餘仍在成品,但 timeline 只記區塊起點,
    // 起點被劃掉就會記成「沒出現」——不算不一致。
    mismatch: checked !== present
      && !(checked && !present && /~~/.test(line.bodyRaw || ''))
      && !coveredByManualOverride,
  };
}

// 哪一列 → 成品時間(播放要跳去的位置)。該列在成品裡就用它的時間(多次出現取最後一次,
// 集錦在前、正文在後);不在成品裡(被剪掉或還沒 apply)就往前找最近一個有時間的列。
function findTimeForLine(doc, timeline, lineIndex) {
  if (!timeline || !doc) return null;
  for (let i = lineIndex; i >= 0; i--) {
    const l = doc.lines[i];
    if (!l || !l.editable) continue;
    const t = timeline.blocks[l.id];
    if (Array.isArray(t) && t.length) return t[t.length - 1];
  }
  return null;
}

// 成品時間 → 哪一張卡:起點 ≤ 該時間的最後一個 block。同一 id 出現在 🎬 集錦
// 與正文時,集錦的時間(成品前段)對到文件裡第一次出現的那列(集錦區),其餘
// 時間對到最後一次出現的那列(正文)。
function findLineAtTime(doc, timeline, secs) {
  if (!timeline || typeof secs !== 'number' || Number.isNaN(secs)) return null;
  if (secs < 0) return OUT_OF_RANGE;          // 負數永遠超出(TL-1-1)
  if (timeline.finalDuration !== null && timeline.finalDuration !== undefined
      && secs > timeline.finalDuration) {
    return OUT_OF_RANGE;
  }
  let best = null;
  for (const [id, times] of Object.entries(timeline.blocks)) {
    if (!Array.isArray(times)) continue;
    times.forEach((t, k) => {
      if (t <= secs && (!best || t > best.t)) best = { t, id, k, n: times.length };
    });
  }
  if (!best) return null;
  const lines = [];
  doc.lines.forEach((l, i) => { if (l.editable && l.id === best.id) lines.push(i); });
  if (!lines.length) return null;
  if (lines.length > 1 && best.n > 1) {
    return best.k === 0 ? lines[0] : lines[lines.length - 1];
  }
  return lines[lines.length - 1];
}

// 「B0059」「b59」「B0101+B0106.mp3」(改動試聽檔名直接貼)→ 那一列的 index。
// 要有字母前綴:純數字是成品時間(findLineAtTime 的事)。同一個 ID 出現多次
// (🎬 集錦在前、正片在後)跳最後一個=正片。找不到回 null。
function findLineById(doc, text) {
  const m = /^\s*([A-Za-z]{1,2})0*(\d+)/.exec(String(text == null ? '' : text));
  if (!m) return null;
  const want = m[1].toUpperCase() + ':' + Number(m[2]);
  let hit = null;
  doc.lines.forEach((l, i) => {
    const k = l.editable && l.id && /^([A-Z]{1,2})0*(\d+)$/.exec(l.id);
    if (k && k[1] + ':' + Number(k[2]) === want) hit = i;
  });
  return hit;
}

const api = {

  parseTimeline,
  parseTimeInput,

  BLOCK_LINE_RE,

  isChapterDivider,

  insertBreak,

  removeRoomtone,
  insertRoomtoneWithHistory,
  removeRoomtoneWithHistory,
  SPEAKER_PREFIX_RE,
  REASON_SEP,
  TRACKS_COL_RE,
  parseTracks,
  hasTracksAudio,
  toggleTrack,
  toggleTrackWithHistory,
  findIllegalEdit,

  parseEdgeTimeMs,
  formatEdgeTimeSec,
  isReviewEdgeLine,
  checkReviewEdgeLines,
  normalizeIntervals,
  unionIntervals,
  subtractIntervals,
  intersectIntervals,
  computeFinalIntervals,
  applyTrimOverride,
  forceWindowOverride,
  extractReviewOverrides,
  applyReviewOverridesToDoc,
  applyReviewOverridesWithHistory,
  assertMECE,
  atomizeBlock,

  PEAKS_BLOCK,

  buildPeaks,

};

if (typeof module !== 'undefined' && module.exports) {
  module.exports = api;
}
if (typeof window !== 'undefined') {

}
