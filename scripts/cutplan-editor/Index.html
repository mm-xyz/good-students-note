  存檔一律經過 CutplanCore.serializeCutplan() 重組全文字串送後端,前端不自己

<script>
(function () {
  'use strict';
  var Core = window.CutplanCore;

  var state = {
    fileId: null,
    doc: null,
    dirty: false,
    history: Core.createHistory(), // undo 堆疊(純資料,見 cutplan-core.js)
  };

  var els = {
    episodeSelect: document.getElementById('episodeSelect'),
    status: document.getElementById('status'),
    blockList: document.getElementById('blockList'),
    undoFloat: document.getElementById('undoFloat'),
    undoBtn: document.getElementById('undoBtn'),
    saveBtn: document.getElementById('saveBtn'),
    dirtyDot: document.getElementById('dirtyDot'),
  };

  function setStatus(msg, kind) {
    els.status.textContent = msg || '';
    els.status.className = kind || '';
  }

  function setDirty(v) {
    state.dirty = v;
    els.dirtyDot.classList.toggle('show', v);
    els.saveBtn.disabled = !v;
  }

  // ── 集數清單 ──────────────────────────────────────────────────────────

  function loadEpisodeList() {
    setStatus('載入集數清單…');
    google.script.run
      .withSuccessHandler(function (episodes) {
        els.episodeSelect.innerHTML = '';
        var placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = episodes.length
          ? '選一集…'
          : '(找不到任何 cutplan.md)';
        els.episodeSelect.appendChild(placeholder);
        episodes.forEach(function (ep) {
          var opt = document.createElement('option');
          opt.value = ep.fileId;
          opt.textContent = ep.name + (ep.layout === 'meta' ? '(_meta)' : '');
          els.episodeSelect.appendChild(opt);
        });
        setStatus(episodes.length ? '' : '找不到任何集數的 cutplan.md', episodes.length ? '' : 'error');
      })
      .withFailureHandler(function (err) {
        setStatus('讀取集數清單失敗:' + (err && err.message ? err.message : err), 'error');
      })
      .listEpisodes();
  }

  els.episodeSelect.addEventListener('change', function () {
    var fileId = els.episodeSelect.value;
    if (!fileId) return;
    if (state.dirty && !confirm('目前的編輯還沒儲存,確定要切換集數嗎?')) {
      els.episodeSelect.value = state.fileId || '';
      return;
    }
    loadCutplan(fileId);
  });

  function loadCutplan(fileId) {
    setStatus('載入 cutplan.md…');
    els.blockList.innerHTML = '';
    setDirty(false);
    state.history = Core.createHistory();
    hideUndoFloat();
    google.script.run
      .withSuccessHandler(function (res) {
        state.fileId = res.fileId;
        state.doc = Core.parseCutplan(res.content);
        render();
        setStatus('已載入:' + res.name, 'ok');
      })
      .withFailureHandler(function (err) {
        setStatus('載入失敗:' + (err && err.message ? err.message : err), 'error');
      })
      .loadCutplan(fileId);
  }

  // ── 渲染 ──────────────────────────────────────────────────────────────

  // 只有這種 `## 標題` 才當「章節分隔線」顯示;⚙/✂/🎵/➕/🎬 這些結構行
  // 是 render 用的參數,對人審沒有意義,不顯示(仍然完整保留在 doc 裡,
  // 只是不在畫面上占位置——存檔時原封不動寫回去)。
  var CHAPTER_DIVIDER_RE = /^## (?!⚙|✂|🎵|➕|🎬)(.+)$/;

  function render() {
    els.blockList.innerHTML = '';
    if (!state.doc) return;
    var shown = 0;
    state.doc.lines.forEach(function (line, idx) {
      if (line.editable) {
        els.blockList.appendChild(renderBlockCard(line, idx));
        shown++;
        return;
      }
      var m = CHAPTER_DIVIDER_RE.exec(line.raw);
      if (m) {
        var div = document.createElement('div');
        div.className = 'chapter-divider';
        div.textContent = '▸ ' + m[1].trim();
        els.blockList.appendChild(div);
      }
    });
    if (!shown) {
      var hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = '這份 cutplan.md 沒有可編輯的 block 行。';
      els.blockList.appendChild(hint);
    }
  }

  function renderBlockCard(line, idx) {
    var card = document.createElement('div');
    card.className = 'block-card' + (line.mark === ' ' ? ' unchecked' : '');
    card.dataset.lineIndex = String(idx);

    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = line.mark !== ' ';
    checkbox.addEventListener('change', function () {
      state.doc = Core.toggleCheckbox(state.doc, idx);
      setDirty(true);
      render();
    });
    card.appendChild(checkbox);

    var main = document.createElement('div');
    main.className = 'block-main';

    var meta = document.createElement('div');
    meta.className = 'block-meta';
    var idSpan = document.createElement('span');
    idSpan.textContent = line.id;
    meta.appendChild(idSpan);
    var tcSpan = document.createElement('span');
    tcSpan.textContent = '[' + line.timecode + ']';
    meta.appendChild(tcSpan);
    if (line.prefix) {
      var spk = document.createElement('span');
      spk.className = 'speaker-tag';
      spk.textContent = line.prefix.trim();
      meta.appendChild(spk);
    }
    main.appendChild(meta);

    var body = document.createElement('div');
    body.className = 'block-body';
    body.dataset.lineIndex = String(idx);
    var pieces = Core.splitStrikes(line.bodyRaw).pieces;
    pieces.forEach(function (p) {
      var node = document.createTextNode(p.raw);
      if (p.kind === 'struck') {
        var s = document.createElement('s');
        s.appendChild(node);
        body.appendChild(s);
      } else {
        body.appendChild(node);
      }
    });
    main.appendChild(body);
    card.appendChild(main);
    return card;
  }

  // ── 反白 → 選取穩定後自動套用刪除線 ─────────────────────────────────

  // 把目前的 window selection 換算成「某個 .block-body 容器內」的 clean
  // 字元座標(逐字元累加 textContent 長度;<s> 標籤不影響座標,因為
  // splitStrikes 的 clean 座標本來就是「畫面上看得到的文字」的座標)。
  function resolveSelection() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    var range = sel.getRangeAt(0);
    var container = range.commonAncestorContainer;
    var bodyEl = (container.nodeType === 1 ? container : container.parentElement);
    bodyEl = bodyEl ? bodyEl.closest('.block-body') : null;
    if (!bodyEl) return null;

    function offsetWithin(node, offset) {
      var walker = document.createTreeWalker(bodyEl, NodeFilter.SHOW_TEXT, null);
      var acc = 0;
      var current;
      while ((current = walker.nextNode())) {
        if (current === node) return acc + offset;
        acc += current.textContent.length;
      }
      return acc; // 選取終點剛好在容器尾端(元素節點邊界)
    }

    var start = offsetWithin(range.startContainer, range.startOffset);
    var end = offsetWithin(range.endContainer, range.endOffset);
    if (end < start) { var t = start; start = end; end = t; }
    if (end <= start) return null;
    return { lineIndex: Number(bodyEl.dataset.lineIndex), start: start, end: end };
  }

  // offsetWithin 的反向:把某行 clean 座標換算回 DOM 的 (text node, offset),
  // 給「復原按鈕要畫在畫面哪裡」用——history 只存 lineIndex/start/end 這種
  // 邏輯位置(見 cutplan-core.js),每次都要在**目前這次 render() 之後**的
  // 真實 DOM 上重新算一次,不能快取舊的 Range(render() 會整個重建
  // .block-body,舊 Range 指到的節點早就不在文件裡了)。
  function nodeAndOffsetForClean(bodyEl, cleanOffset) {
    var walker = document.createTreeWalker(bodyEl, NodeFilter.SHOW_TEXT, null);
    var acc = 0;
    var current;
    var last = null;
    while ((current = walker.nextNode())) {
      var len = current.textContent.length;
      if (cleanOffset <= acc + len) {
        return { node: current, offset: cleanOffset - acc };
      }
      acc += len;
      last = current;
    }
    return last ? { node: last, offset: last.textContent.length } : null;
  }

  function rangeForClean(lineIndex, start, end) {
    var bodyEl = els.blockList.querySelector('.block-body[data-line-index="' + lineIndex + '"]');
    if (!bodyEl) return null;
    var a = nodeAndOffsetForClean(bodyEl, start);
    var b = nodeAndOffsetForClean(bodyEl, end);
    if (!a || !b) return null;
    var range = document.createRange();
    range.setStart(a.node, a.offset);
    range.setEnd(b.node, b.offset);
    return range;
  }

  // ── 選取穩定判定 ─────────────────────────────────────────────────────
  //
  // `selectionchange` 在拖曳選取控制點(handle)的過程中會連續觸發,不能
  // 一有變化就套用,否則手機上「拖著調整範圍」會變成「連續套用又取消」。
  //
  // Prior art(這是有風險的互動設計問題,查過才動手,不是自己發明):
  //   - Robert Knight(Hypothesis 網頁註解工具作者)2016 年的跨瀏覽器
  //     selection 事件測試筆記,結論是 `selectionchange` 本身無法分辨
  //     「還在調整」與「調整完了」,必須搭配 `touchend`/`mouseup` 這種
  //     「手指/滑鼠放開」的完成訊號一起用。
  //     https://gist.github.com/robertknight/ad9f1bca8280b3fa325817aa3ed9935c
  //   - W3C selection-api repo issue #146("Having a matching `selectend`
  //     event?")討論串,現況共識是瀏覽器沒有原生 selectend,一般作法是
  //     `selectionchange` + debounce/timer,再疊 `mouseup`/`touchend`/
  //     `pointerup` 當完成訊號。
  //     https://github.com/w3c/selection-api/issues/146
  //
  // 採用的判定策略(在上述兩個來源的共識上,多加一條處理「二次調整」):
  //   1. `selectionchange`(拖曳全程都會連續觸發)→ 重新排一個「保底」
  //      debounce 計時器(SETTLE_DEBOUNCE_MS)。這條專門對付鍵盤選取
  //      (桌機 shift+方向鍵)——鍵盤選取沒有 pointerup/mouseup 可以當
  //      完成訊號,只能純靠「一段時間沒有再變化」判定穩定。
  //   2. `pointerup`/`touchend`/`mouseup`(手指/滑鼠放開)→ 排一個短很多
  //      的計時器(SETTLE_AFTER_POINTER_MS),取代保底的那個——放開了就是
  //      有強訊號,不必等那麼久,行動裝置上等 450ms 會感覺明顯delay。
  //   3. `pointerdown`/`touchstart`/`mousedown`(手指/滑鼠再次按下)→
  //      **立刻取消**任何還在等待的計時器。這是本次在兩份 prior art 之外
  //      自己補的一條:文件/issue 討論的是「單次選取何時算完成」,沒有處理
  //      「放開後在很短時間內又抓住 handle 二次調整」這個情境——如果不擋,
  //      使用者放開手指想拖 handle 微調範圍時,那個 60ms 的短計時器可能在
  //      手指再次按下之前就先套用了,把選取清掉、剛好搗亂使用者正在做的
  //      調整動作。加了這條防線後最壞情況只是「多套用一次、可以直接復原」
  //      (見下方 trySettle 的 try/catch 與 undo 堆疊),不會弄壞資料。
  //   計時器只有一個(pendingSettleTimer),新排程一律先清舊的——不會有兩個
  //   計時器互相搶跑的問題。
  var SETTLE_AFTER_POINTER_MS = 60;
  var SETTLE_DEBOUNCE_MS = 450;
  var pendingSettleTimer = null;

  function scheduleSettle(delayMs) {
    if (pendingSettleTimer) clearTimeout(pendingSettleTimer);
    pendingSettleTimer = setTimeout(trySettle, delayMs);
  }

  function cancelPendingSettle() {
    if (pendingSettleTimer) {
      clearTimeout(pendingSettleTimer);
      pendingSettleTimer = null;
    }
  }

  function trySettle() {
    pendingSettleTimer = null;
    var picked = resolveSelection();
    // 沒有選取,或選取是 collapsed——這是最常見的狀態(單純點一下移游標、
    // 點 checkbox…),不是「使用者想套用刪除線但失敗了」,不提示,靜默
    // 什麼都不做才是對的行為(對照:空選取仍然無法套用,但那是 API 層的
    // 保證——見 cutplan-core.js classifySelection 的 'empty' 狀態,直接
    // 呼叫 toggleStrike/applyStrike 一樣會丟錯,不會靜默失敗)。
    if (!picked) return;
    var line = state.doc.lines[picked.lineIndex];
    var mode = Core.classifySelection(line.bodyRaw, picked.start, picked.end);
    if (mode !== 'add' && mode !== 'remove') return; // 'empty'/'invalid' 防禦,理論上不會走到
    try {
      var result = Core.applyStrikeWithHistory(
        state.doc, state.history, picked.lineIndex, picked.start, picked.end,
      );
      state.doc = result.doc;
      state.history = result.history;
      setDirty(true);
      window.getSelection().removeAllRanges();
      render();
      positionUndoFloat(picked.lineIndex, picked.start, picked.end);
    } catch (e) {
      setStatus('自動套用刪除線失敗:' + e.message, 'error');
    }
  }

  document.addEventListener('selectionchange', function () {
    scheduleSettle(SETTLE_DEBOUNCE_MS);
  });
  document.addEventListener('pointerdown', cancelPendingSettle);
  document.addEventListener('touchstart', cancelPendingSettle);
  document.addEventListener('mousedown', cancelPendingSettle);
  document.addEventListener('pointerup', function () { scheduleSettle(SETTLE_AFTER_POINTER_MS); });
  document.addEventListener('touchend', function () { scheduleSettle(SETTLE_AFTER_POINTER_MS); });
  document.addEventListener('mouseup', function () { scheduleSettle(SETTLE_AFTER_POINTER_MS); });

  // ── 復原按鈕:浮動貼在剛套用那段選取範圍的右上角 ─────────────────────
  //
  // MM 指定:不要固定在畫面某處的 bar——剪的時候視線停在正在處理的那段
  // 文字上,undo 要就近才點得到。
  //
  // 定位用 absolute + 文件座標(range 的 client rect + window.scrollX/Y),
  // 不是 fixed + 視窗座標——這樣頁面捲動時按鈕會跟著內容一起移動,不會
  // 捲走了還指著錯誤的位置。取捨:另一個選項是「捲動就整個隱藏」,兩個
  // 都在規格允許範圍內,選「跟著捲」是因為剪輯是斷續的,人可能盯著聽一段
  // 音檔才回頭決定要不要復原,捲動看別的段落時按鈕消失會讓人以為沒得復原
  // 了(跟「不設自動淡出計時器」是同一個理由:不要在使用者還沒決定的時候
  // 就把選項收走)。
  var UNDO_GAP = 8;
  var VIEWPORT_MARGIN = 8;

  function positionUndoFloat(lineIndex, start, end) {
    var range = rangeForClean(lineIndex, start, end);
    if (!range) { hideUndoFloat(); return; }
    // 選取橫跨多行時 getBoundingClientRect() 回的是整體外框(含中間行的
    // 滿版寬度),不符合「剛剛選的那裡」的直覺;getClientRects()[0] 是
    // 第一行(選取起點那一行)的 rect,貼這裡才對。
    var rects = range.getClientRects();
    var rect = rects.length ? rects[0] : range.getBoundingClientRect();
    if (!rect || (rect.width === 0 && rect.height === 0)) { hideUndoFloat(); return; }

    var el = els.undoFloat;
    el.style.visibility = 'hidden';
    el.style.display = 'block';
    var w = el.offsetWidth;
    var h = el.offsetHeight;

    // 先在「視窗座標」算好貼右上角、clamp 進可視範圍的位置,最後才加
    // scrollX/scrollY 轉成文件座標存進 style——這樣邏輯只要考慮「現在看
    // 得到的範圍」,不用同時想文件座標的 clamp 邊界。
    var viewportLeft = rect.right - w;
    viewportLeft = Math.min(viewportLeft, window.innerWidth - w - VIEWPORT_MARGIN);
    viewportLeft = Math.max(viewportLeft, VIEWPORT_MARGIN);

    var viewportTop = rect.top - h - UNDO_GAP; // 預設貼在選取範圍「上方」
    if (viewportTop < VIEWPORT_MARGIN) {
      viewportTop = rect.bottom + UNDO_GAP; // 太靠近視窗上緣會被裁掉,改貼下方
    }
    viewportTop = Math.min(viewportTop, window.innerHeight - h - VIEWPORT_MARGIN);
    viewportTop = Math.max(viewportTop, VIEWPORT_MARGIN);

    el.style.left = (viewportLeft + window.scrollX) + 'px';
    el.style.top = (viewportTop + window.scrollY) + 'px';
    el.style.visibility = 'visible';
  }

  function hideUndoFloat() {
    els.undoFloat.style.display = 'none';
  }

  els.undoBtn.addEventListener('click', function () {
    var result = Core.undo(state.doc, state.history);
    if (!result.undone) {
      hideUndoFloat(); // 防禦:理論上按鈕沒東西可復原時本來就該是隱藏的
      return;
    }
    state.doc = result.doc;
    state.history = result.history;
    setDirty(true);
    render();
    var next = Core.peekHistory(state.history);
    if (next) {
      // 點一次撤一步,按鈕跳到「再上一步」操作的位置(還有東西可以復原)。
      positionUndoFloat(next.lineIndex, next.start, next.end);
    } else {
      hideUndoFloat();
    }
  });

  // ── 儲存 ──────────────────────────────────────────────────────────────

  els.saveBtn.addEventListener('click', function () {
    if (!state.doc || !state.fileId) return;
    els.saveBtn.disabled = true;
    setStatus('儲存中…');
    var content = Core.serializeCutplan(state.doc);
    google.script.run
      .withSuccessHandler(function () {
        setDirty(false);
        state.history = Core.createHistory(); // 已落地就不需要再回頭復原
        hideUndoFloat();
        setStatus('已儲存 ✓', 'ok');
      })
      .withFailureHandler(function (err) {
        els.saveBtn.disabled = false;
        setStatus('儲存失敗:' + (err && err.message ? err.message : err), 'error');
      })
      .saveCutplan(state.fileId, content);
  });

  loadEpisodeList();
})();
</script>
